<!DOCTYPE html>
<html>
<head>
    <title>Member Service Console</title>
</head>

<body>

<h1>Community Credit Union</h1>

<h2>Member Search</h2>

<form method="post" action="/member">

    <table>
        <tr>
            <td>
                <label for="member_id">Member ID</label>
            </td>

            <td>
                <input
                    id="member_id"
                    name="member_id"
                    type="text"
                    required
                >
            </td>
        </tr>
    </table>

    <br>

    <button type="submit">
        Search
    </button>

</form>

</body>
</html>
